name: Deploy public site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/check-site.py"
      - "scripts/__tests__/test_check_site.py"
      - "scripts/localize-site.py"
      - "scripts/site/**"
      - "scripts/__tests__/test_site_localization.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate public site
        run: |
          python3 -B -m unittest discover -s scripts/__tests__ -p 'test_check_site.py'
          python3 -B -m unittest discover -s scripts/__tests__ -p 'test_site_localization.py'
          python3 -B scripts/localize-site.py --check
          python3 -B scripts/check-site.py
          node --check site/assets/site.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
