<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Markdown Plus product preview</title>
  <desc id="desc">An abstract workspace illustration using the Markdown Plus palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.55" stop-color="#102e50"/>
      <stop offset="1" stop-color="#17434b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="85"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="220" cy="180" r="220" fill="#38bdf8" opacity=".22" filter="url(#blur)"/>
  <circle cx="1390" cy="820" r="290" fill="#a78bfa" opacity=".2" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="170" y="120" width="1260" height="760" rx="34" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="170" y="120" width="1260" height="74" rx="34" fill="#172033"/>
    <circle cx="220" cy="157" r="10" fill="#fb7185"/><circle cx="252" cy="157" r="10" fill="#fbbf24"/><circle cx="284" cy="157" r="10" fill="#4ade80"/>
    <rect x="212" y="236" width="250" height="600" rx="22" fill="#101b2e" stroke="#26354c"/>
    <text x="248" y="290" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22" font-weight="700" letter-spacing="3">FILES</text>
    <g fill="#dbeafe" font-family="system-ui,sans-serif" font-size="24">
      <text x="248" y="356">◆ README.md</text><text x="248" y="412">◇ architecture.md</text><text x="248" y="468">⌘ diagrams</text><text x="280" y="522">◇ release-flow</text><text x="248" y="578">⌘ guides</text><text x="248" y="634">⌘ images</text>
    </g>
    <rect x="510" y="236" width="660" height="600" rx="22" fill="#f8fafc"/>
    <text x="570" y="340" fill="#64748b" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="4">MARKDOWN PLUS</text>
    <text x="570" y="422" fill="#0f172a" font-family="system-ui,sans-serif" font-size="54" font-weight="800">Ideas, beautifully focused.</text>
    <text x="570" y="482" fill="#475569" font-family="system-ui,sans-serif" font-size="25">Read, navigate, edit, and export local Markdown.</text>
    <rect x="570" y="548" width="530" height="182" rx="20" fill="#0f172a"/>
    <circle cx="616" cy="594" r="10" fill="#67e8f9"/>
    <text x="648" y="604" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="23">const workspace = await open()</text>
    <path d="M608 670h90l48-48 76 76 78-118 120 90" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1218" y="236" width="170" height="600" rx="22" fill="#101b2e" stroke="#26354c"/>
    <text x="1248" y="290" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="2">OUTLINE</text>
    <g fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="19"><text x="1248" y="352">Overview</text><text x="1248" y="400">Workspace</text><text x="1248" y="448">Themes</text><text x="1248" y="496">Export</text></g>
  </g>
</svg>
