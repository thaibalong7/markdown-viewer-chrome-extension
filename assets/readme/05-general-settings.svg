<text x="966" y="227" font-size="18" fill="#172033" font-weight="700">Open General</text>
<text x="926" y="260" font-size="17" fill="#667085" font-weight="400">Start with the General</text>
<text x="926" y="285" font-size="17" fill="#667085" font-weight="400">section in Settings.</text>
<circle cx="940" cy="375" r="15" fill="#dc2626"/>
<text x="940" y="381" font-size="17" fill="white" font-weight="700" text-anchor="middle">2</text>
<text x="966" y="381" font-size="18" fill="#172033" font-weight="700">Interface language</text>
<text x="926" y="414" font-size="17" fill="#667085" font-weight="400">Choose your language</text>
<text x="926" y="439" font-size="17" fill="#667085" font-weight="400">or follow the browser.</text>
<circle cx="940" cy="535" r="15" fill="#dc2626"/>
<text x="940" y="541" font-size="17" fill="white" font-weight="700" text-anchor="middle">3</text>
<text x="966" y="541" font-size="18" fill="#172033" font-weight="700">Document updates</text>
<text x="926" y="574" font-size="17" fill="#667085" font-weight="400">Choose Ask, Automatic,</text>
<text x="926" y="599" font-size="17" fill="#667085" font-weight="400">or Off for external edits.</text>
<circle cx="940" cy="691" r="15" fill="#dc2626"/>
<text x="940" y="697" font-size="17" fill="white" font-weight="700" text-anchor="middle">4</text>
<text x="966" y="697" font-size="18" fill="#172033" font-weight="700">Check file access</text>
<text x="926" y="730" font-size="17" fill="#667085" font-weight="400">Allowed means Chrome</text>
<text x="926" y="755" font-size="17" fill="#667085" font-weight="400">has granted file URL access.</text>
<text x="926" y="780" font-size="17" fill="#667085" font-weight="400">Enable it in Chrome if blocked.</text>
