<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">04 · Build your custom theme</title>
<desc id="desc">Theme editor · Changes stay in the draft until you save. Red outlines and numbered markers identify the controls explained in the accompanying guide. This is a simplified interface illustration, not a screenshot.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} .ring{fill:none;stroke:#dc2626;stroke-width:3} </style>
<rect x="0" y="0" width="1200" height="1000" rx="0" fill="#f6f8fb"/>
<text x="28" y="39" font-size="27" fill="#172033" font-weight="700">04 · Build your custom theme</text>
<text x="28" y="72" font-size="18" fill="#667085" font-weight="400">Theme editor · Changes stay in the draft until you save.</text>
<text x="1172" y="37" font-size="12" fill="#667085" font-weight="700" text-anchor="end">INTERFACE ILLUSTRATION</text>
<text x="926" y="138" font-size="13" fill="#dc2626" font-weight="700">RED MARKERS</text>
<text x="28" y="980" font-size="14" fill="#667085" font-weight="400">Markdown Plus · User guide · Example values shown</text>
<rect x="24" y="106" width="860" height="855" rx="16" fill="white" stroke="#dce2ea"/>
<text x="48" y="147" font-size="21" fill="#172033" font-weight="700">Markdown Plus</text>
<text x="218" y="147" font-size="17" fill="#667085" font-weight="400">Settings</text>
<text x="858" y="147" font-size="13" fill="#047857" font-weight="400" text-anchor="end">Settings are up to date.</text>
<path d="M24 171H884" stroke="#dce2ea" stroke-width="1"/>
<rect x="25" y="172" width="204" height="788" rx="0" fill="#eef2f6"/>
<text x="49" y="220" font-size="16" fill="#172033" font-weight="400">General</text>
<rect x="37" y="258" width="179" height="43" rx="8" fill="#eaf2ff"/>
<text x="49" y="283" font-size="16" fill="#2563eb" font-weight="600">Themes</text>
<text x="49" y="346" font-size="16" fill="#172033" font-weight="400">Files &amp; Workspace</text>
<text x="49" y="409" font-size="16" fill="#172033" font-weight="400">Privacy &amp; Data</text>
<text x="49" y="472" font-size="16" fill="#172033" font-weight="400">Advanced</text>
<text x="49" y="535" font-size="16" fill="#172033" font-weight="400">About</text>
<text x="252" y="221" font-size="27" fill="#172033" font-weight="700">Create custom theme</text>
<rect x="252" y="251" width="340" height="638" rx="12" fill="white" stroke="#dce2ea"/>
<text x="270" y="286" font-size="16" fill="#172033" font-weight="600">Theme name</text>
<rect x="270" y="298" width="304" height="42" rx="8" fill="white" stroke="#c5ced9"/>
<text x="282" y="325" font-size="17" fill="#172033" font-weight="400">My reading theme</text>
<text x="270" y="365" font-size="16" fill="#172033" font-weight="600">Base theme</text>
<rect x="270" y="377" width="304" height="42" rx="8" fill="white" stroke="#c5ced9"/>
<text x="282" y="404" font-size="17" fill="#172033" font-weight="400">Dark</text>
<path d="M548 394l6 6 6-6" fill="none" stroke="#667085" stroke-width="2"/>
<text x="270" y="457" font-size="19" fill="#172033" font-weight="700">Colors</text>
<rect x="270" y="474" width="88" height="43" rx="8" fill="#151b26" stroke="#dce2ea"/>
<text x="314" y="543" font-size="14" fill="#667085" font-weight="400" text-anchor="middle">Page</text>
<rect x="371" y="474" width="88" height="43" rx="8" fill="#edf2f7" stroke="#dce2ea"/>
<text x="415" y="543" font-size="14" fill="#667085" font-weight="400" text-anchor="middle">Text</text>
<rect x="472" y="474" width="88" height="43" rx="8" fill="#7ab7ff" stroke="#dce2ea"/>
<text x="516" y="543" font-size="14" fill="#667085" font-weight="400" text-anchor="middle">Links</text>
<text x="270" y="589" font-size="16" fill="#172033" font-weight="600">Rendered code theme</text>
<rect x="270" y="601" width="304" height="42" rx="8" fill="white" stroke="#c5ced9"/>
<text x="282" y="628" font-size="17" fill="#172033" font-weight="400">Follow base theme</text>
<path d="M548 618l6 6 6-6" fill="none" stroke="#667085" stroke-width="2"/>
<text x="270" y="681" font-size="16" fill="#172033" font-weight="600">Background type</text>
<rect x="270" y="693" width="304" height="42" rx="8" fill="white" stroke="#c5ced9"/>
<text x="282" y="720" font-size="17" fill="#172033" font-weight="400">Local image or animation</text>
<path d="M548 710l6 6 6-6" fill="none" stroke="#667085" stroke-width="2"/>
<rect x="270" y="755" width="120" height="38" rx="8" fill="white" stroke="#c5ced9"/>
<text x="330.0" y="780" font-size="16" fill="#172033" font-weight="600" text-anchor="middle">Choose file</text>
<text x="404" y="780" font-size="15" fill="#667085" font-weight="400">background.png</text>
<rect x="270" y="835" width="103" height="38" rx="8" fill="white" stroke="#c5ced9"/>
<text x="321.5" y="860" font-size="16" fill="#172033" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="426" y="835" width="148" height="38" rx="8" fill="#2563eb"/>
<text x="500.0" y="860" font-size="16" fill="white" font-weight="600" text-anchor="middle">Create theme</text>
<rect x="610" y="251" width="249" height="340" rx="12" fill="#151b26"/>
<text x="629" y="281" font-size="13" fill="#b1a6ff" font-weight="700">LIVE PREVIEW</text>
<text x="629" y="320" font-size="19" fill="#edf2f7" font-weight="700">My reading theme</text>
<path d="M629 340H839" stroke="#465469" stroke-width="1"/>
<text x="629" y="373" font-size="17" fill="#dce4ee" font-weight="400">A comfortable space</text>
<text x="629" y="398" font-size="17" fill="#dce4ee" font-weight="400">for your Markdown.</text>
<text x="629" y="451" font-size="17" fill="#7ab7ff" font-weight="400">A link in your theme</text>
<rect x="629" y="477" width="210" height="84" rx="8" fill="#0b111a"/>
<text x="644" y="509" font-size="15" fill="#b1a6ff" font-weight="400">const theme =</text>
<text x="644" y="538" font-size="15" fill="#56d39a" font-weight="400">  &quot;My reading theme&quot;;</text>
<text x="610" y="631" font-size="15" fill="#667085" font-weight="400">Preview updates as you edit.</text>
<text x="610" y="655" font-size="15" fill="#667085" font-weight="400">The viewer changes after save.</text>
<!-- Name and base fields: 8 px outline padding. -->
<rect x="262" y="262" width="320" height="165" rx="16" class="ring"/>
<circle cx="246" cy="344.5" r="15" fill="#dc2626" stroke="white" stroke-width="2"/>
<text x="246" y="350.5" font-size="17" fill="white" font-weight="700" text-anchor="middle">1</text>
<!-- Color heading, swatches, and labels: 8 px outline padding. -->
<rect x="262" y="430" width="320" height="125" rx="16" class="ring"/>
<circle cx="246" cy="492.5" r="15" fill="#dc2626" stroke="white" stroke-width="2"/>
<text x="246" y="498.5" font-size="17" fill="white" font-weight="700" text-anchor="middle">2</text>
<!-- Rendered code theme label and select: 8 px outline padding. -->
<rect x="262" y="565" width="320" height="86" rx="16" class="ring"/>
<circle cx="246" cy="608" r="15" fill="#dc2626" stroke="white" stroke-width="2"/>
<text x="246" y="614" font-size="17" fill="white" font-weight="700" text-anchor="middle">3</text>
<!-- Background label, select, and file input: 8 px outline padding. -->
<rect x="262" y="657" width="320" height="144" rx="16" class="ring"/>
<circle cx="246" cy="729" r="15" fill="#dc2626" stroke="white" stroke-width="2"/>
<text x="246" y="735" font-size="17" fill="white" font-weight="700" text-anchor="middle">4</text>
<!-- Create theme button: 8 px outline padding. -->
<rect x="418" y="827" width="164" height="54" rx="16" class="ring"/>
<circle cx="598" cy="854" r="15" fill="#dc2626" stroke="white" stroke-width="2"/>
<text x="598" y="860" font-size="17" fill="white" font-weight="700" text-anchor="middle">5</text>
<circle cx="940" cy="236" r="15" fill="#dc2626"/>
<text x="940" y="242" font-size="17" fill="white" font-weight="700" text-anchor="middle">1</text>
<text x="966" y="242" font-size="18" fill="#172033" font-weight="700">Name and base</text>
<text x="926" y="275" font-size="17" fill="#667085" font-weight="400">Name your theme and</text>
<text x="926" y="300" font-size="17" fill="#667085" font-weight="400">choose its starting palette.</text>
<circle cx="940" cy="399" r="15" fill="#dc2626"/>
<text x="940" y="405" font-size="17" fill="white" font-weight="700" text-anchor="middle">2</text>
<text x="966" y="405" font-size="18" fill="#172033" font-weight="700">Choose colors</text>
<text x="926" y="438" font-size="17" fill="#667085" font-weight="400">Adjust page, text, links,</text>
<text x="926" y="463" font-size="17" fill="#667085" font-weight="400">panels, and accents.</text>
<circle cx="940" cy="547" r="15" fill="#dc2626"/>
<text x="940" y="553" font-size="17" fill="white" font-weight="700" text-anchor="middle">3</text>
<text x="966" y="553" font-size="18" fill="#172033" font-weight="700">Code colors</text>
<text x="926" y="586" font-size="17" fill="#667085" font-weight="400">Follow the base theme</text>
<text x="926" y="611" font-size="17" fill="#667085" font-weight="400">or choose a syntax theme.</text>
<circle cx="940" cy="697" r="15" fill="#dc2626"/>
<text x="940" y="703" font-size="17" fill="white" font-weight="700" text-anchor="middle">4</text>
<text x="966" y="703" font-size="18" fill="#172033" font-weight="700">Background</text>
<text x="926" y="736" font-size="17" fill="#667085" font-weight="400">Pick a color, gradient,</text>
<text x="926" y="761" font-size="17" fill="#667085" font-weight="400">or local image; scroll for</text>
<text x="926" y="786" font-size="17" fill="#667085" font-weight="400">fit and motion controls.</text>
<circle cx="940" cy="854" r="15" fill="#dc2626"/>
<text x="940" y="860" font-size="17" fill="white" font-weight="700" text-anchor="middle">5</text>
<text x="966" y="860" font-size="18" fill="#172033" font-weight="700">Save the theme</text>
<text x="926" y="893" font-size="17" fill="#667085" font-weight="400">Choose Create theme</text>
<text x="926" y="918" font-size="17" fill="#667085" font-weight="400">or Save changes. It then</text>
<text x="926" y="943" font-size="17" fill="#667085" font-weight="400">becomes the active theme.</text>
</svg>
